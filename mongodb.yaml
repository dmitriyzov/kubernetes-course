apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-deployment
  labels:
    app: mongodb-depl
spec:
  replicas: 1
  selector: # matches Pods that have the label `app:mongodb`
    matchLabels:
      app: mongodb
  template: # blueprint for the pod
    metadata:
      labels: # sets label on Pods which Deployment selector uses to find them
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo
          ports:
            - containerPort: 27017 # the port the container is available on
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret # name of the secret
                  key: mongodb-root-username # name of the secret key
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: mongodb-root-password
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
spec:
  selector:
    app: mongodb # connect to Pods with this label
  ports:
    - protocol: TCP
      port: 27017 # the port we expose on the service. Can differ from target port
      targetPort: 27017 # the container port (Pod) we forward the requests to
